{% extends "base.html" %}
{% block title %}Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="fs-1 text-warning"><i class="bi bi-question-circle-fill"></i></div>
  <h1 class="display-4 fw-bold">404</h1>
  <p class="lead text-muted">Page not found.</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
