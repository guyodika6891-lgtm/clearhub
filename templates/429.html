{% extends "base.html" %}
{% block title %}Too Many Requests{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="fs-1 text-warning"><i class="bi bi-hourglass-split"></i></div>
  <h1 class="display-4 fw-bold">429</h1>
  <p class="lead text-muted">Slow down — you've made too many requests.</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
