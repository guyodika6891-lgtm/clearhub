{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="fs-1 text-danger"><i class="bi bi-shield-lock-fill"></i></div>
  <h1 class="display-4 fw-bold">403</h1>
  <p class="lead text-muted">You don't have permission to access this page.</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
